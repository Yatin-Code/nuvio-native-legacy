<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nuvio NaCl spike</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #nacl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #log { position: absolute; left: 30px; top: 20px; z-index: 5; color: #b8f5c0;
         font: 26px/1.4 monospace; white-space: pre-wrap; text-shadow: 0 0 4px #000; }
</style>
</head>
<body>
<embed id="nacl" src="spike.nmf" type="application/x-nacl" width="1920" height="1080">
<div id="log"></div>
<script>
var L = document.getElementById('log'), nacl = document.getElementById('nacl');
var linhas = [];
function log(s) { linhas.push(s); if (linhas.length > 14) linhas.shift(); L.textContent = linhas.join('\n'); }
log('UA: ' + navigator.userAgent.replace(/.*(Tizen[^)]*).*(Chrome\/[0-9.]+).*/, '$1 $2'));
log('plugin x-nacl: ' + !!(navigator.mimeTypes && navigator.mimeTypes['application/x-nacl']));
var m = document.getElementById('nacl');
['loadstart', 'progress', 'load', 'error', 'abort', 'crash', 'loadend'].forEach(function (e) {
  m.addEventListener(e, function () { log('nacl ' + e + (e === 'crash' ? ' exit=' + m.exitStatus : '') + (e === 'error' ? ' ' + m.lastError : '')); }, true);
});
m.addEventListener('message', function (ev) {
  var d = String(ev.data);
  if (d.indexOf('fetch ') === 0) {
    var url = d.slice(6), x = new XMLHttpRequest();
    x.open('GET', url); x.timeout = 15000;
    x.onload = function () { m.postMessage('fetched ' + x.status + ' ' + (x.responseText || '').length); log('https ' + x.status + ' bytes=' + (x.responseText || '').length); };
    x.onerror = x.ontimeout = function () { m.postMessage('fetcherr'); log('https FALHOU'); };
    x.send();
  } else log('mod: ' + d);
});
</script>
</body>
</html>
