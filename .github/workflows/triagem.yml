name: Triagem Automática de Logs

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 */6 * * *'  # A cada 6 horas

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run triage
        run: |
          cd servidor/recomendacoes
          node triagem-v2.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/triagem-comment.md', 'utf8');

            // Procura issue com label 'triagem'
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'triagem',
              state: 'open',
              per_page: 1,
            });

            if (issues.data.length === 0) {
              console.log('Nenhuma issue de triagem encontrada');
              return;
            }

            const issueNumber = issues.data[0].number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment,
            });

            console.log(`Comentário postado na issue #${issueNumber}`);
