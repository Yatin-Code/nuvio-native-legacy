name: Log Triage

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          npm install --global wrangler

      - name: Run log triage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 tools/triagem.py

      - name: Post comment to triagem issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find or create the "Relatório de logs" issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'triagem',
              state: 'open',
              per_page: 1
            });

            let triagem_issue_number = null;
            if (issues.data.length > 0) {
              // Check if any has "Relatório" in title
              const triagem = issues.data.find(i => i.title.includes('Relatório'));
              if (triagem) {
                triagem_issue_number = triagem.number;
              }
            }

            // If not found, this is OK - just exit
            if (!triagem_issue_number) {
              console.log('Triagem issue not found (not created yet)');
              process.exit(0);
            }

            // Read the comment from triagem.py output if it was saved
            // For now, just acknowledge the run
            const comment = `
## Triagem Automática Executada

✓ Run iniciado pelo evento: \`${context.eventName}\`
- Timestamp: ${new Date().toISOString()}
- Commit: ${context.sha.substring(0, 7)}

Aguardando análise dos logs...
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: triagem_issue_number,
              body: comment.trim()
            });
